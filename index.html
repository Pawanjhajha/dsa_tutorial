<body>
    <script>
        function rotate(array){
            let arr=array;
            console.log(array,"before")
            for(let i=0;i<arr.length;i++){
               for(let j=0;j<i;j++){
                let tem=arr[i][j];
                arr[i][j]=arr[j][i];
                arr[j][i]=tem;
               }
            }
            console.log(arr,"arr")
            //using function 
    //         for (let i = 0; i < arr.length; i++) {
    //     arr[i].reverse();
    // }
    //manually reverse
    for (let i = 0; i < arr.length; i++) {
        let left = 0, right = arr[i].length - 1;
        while (left < right) {
            let temp = arr[i][left];
            arr[i][left] = arr[i][right];
            arr[i][right] = temp;
            left++;
            right--;
        }
    }
    return arr;
        }
        const ouptut=rotate([
  [1, 2, 3],  
  [4, 5, 6],  
  [7, 8, 9]
])
console.log(ouptut)
    </script>
</body>
