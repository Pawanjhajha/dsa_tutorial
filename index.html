    <script>
      function findIntersection(arr1, arr2) {
    let freqMap = {};
    let result = [];

    // Store frequency of elements in arr1
    for (let num of arr1) {
        freqMap[num] = (freqMap[num] || 0) + 1;
    }

    // Check if elements of arr2 exist in the hashmap
    for (let num of arr2) {
        console.log(freqMap[num]>0,num)
        if (freqMap[num] > 0) {
            result.push(num);
            freqMap[num]--; // Reduce count to maintain frequency
        }
    }
    return result;
}

console.log(findIntersection([1, 2, 2, 2, 3, 4], [2, 2, 4, 6])); 
// Output: [2, 2, 4]

    </script>
