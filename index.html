<body>
    <script>
        function integers(arr1,arr2){
           
            let res=[];
            let k=0;
            for(i=0;i<arr1.length;i++){
                for(j=0;j<arr2.length;j++){
                    if(arr1[i]==arr2[j]){
                        res[k]=arr1[i];
                        k++;
                        console.log(res,"res")
                        break;
                    }
                }
            }
            return res;
            // return arr1.filter((val)=>{
            //     return arr2.includes(val)
            // })
        }
        const result=integers([1, 2, 2, 3, 4],[2, 2, 4, 6,2,5,3,4]);
        console.log(result,"result")
    </script>
